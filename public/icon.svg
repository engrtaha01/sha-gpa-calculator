<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Graduation Cap & Emblem in Center Safe Zone -->
  <g transform="translate(256, 210)" filter="url(#shadow)">
    <!-- Mortarboard rhombus top -->
    <polygon points="0,-90 140,-35 0,20 -140,-35" fill="url(#goldGrad)"/>
    <!-- Cap base skullcap -->
    <path d="M-75,-5 C-75,45 75,45 75,-5 L70,-15 C50,25 -50,25 -70,-15 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Tassel button & cord -->
    <circle cx="0" cy="-35" r="8" fill="#ffffff"/>
    <path d="M0,-35 Q-90,-20 -115,20" fill="none" stroke="#fde047" stroke-width="5" stroke-linecap="round"/>
    <polygon points="-115,20 -125,50 -105,50" fill="#fde047"/>
  </g>

  <!-- SHA Typography & GPA Ribbon -->
  <g transform="translate(256, 375)">
    <!-- Gold GPA text -->
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="58" fill="#ffffff" letter-spacing="4">
      SHA GPA
    </text>
    <text y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="22" fill="#38bdf8" letter-spacing="2">
      EL SHOROUK ACADEMY
    </text>
  </g>
</svg>
